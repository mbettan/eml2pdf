[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eml2pdf"
version = "1.1.0"
description = "Convert EML email files to PDF documents"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Michaël BETTAN" }]
keywords = ["eml", "email", "pdf", "converter", "archive"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications :: Email",
    "Topic :: Office/Business",
]
dependencies = [
    "weasyprint>=60.0",
    "beautifulsoup4>=4.11.0",
    "chardet>=5.0.0",
    "markdown>=3.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
docs = [
    "sphinx>=6.0",
    "myst-parser>=2.0",
    "sphinx-rtd-theme>=1.3",
]
dev = [
    "eml2pdf[test,docs]",
    "poethepoet>=0.24",
    "build>=1.0",
    "twine>=4.0",
    "ruff>=0.1.0",
]

[project.scripts]
eml2pdf = "eml2pdf:main"

[project.urls]
Homepage = "https://github.com/yourorg/eml2pdf"
Documentation = "https://eml2pdf.readthedocs.io"
Issues = "https://github.com/yourorg/eml2pdf/issues"

# ═══════════════════════════════════════════════════════════════════
# Poe the Poet tasks
# ═══════════════════════════════════════════════════════════════════

[tool.poe.tasks]
test = "pytest tests/"
test-verbose = "pytest -vv tests/"
coverage = "pytest --cov=eml2pdf --cov-report=term-missing --cov-report=html tests/"
lint = "ruff check ."
format = "ruff format ."
docs = "sphinx-build -b html docs/ docs/_build/html"
docs-serve = "python -m http.server 8000 --directory docs/_build/html"
docs-clean = "rm -rf docs/_build"
build = "python -m build"
clean = { shell = "rm -rf build/ dist/ *.egg-info **/__pycache__ .pytest_cache .coverage htmlcov/" }
clean-all = ["clean", "docs-clean"]
upload-test = "twine upload --repository testpypi dist/*"
upload = "twine upload dist/*"
dev-setup = ["clean", { cmd = "pip install -e .[dev]" }]

# ═══════════════════════════════════════════════════════════════════
# Tool configs
# ═══════════════════════════════════════════════════════════════════

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["eml2pdf"]
branch = true
